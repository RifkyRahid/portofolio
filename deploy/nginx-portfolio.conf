server {
    listen 80;
    server_name rifkyrahid.my.id www.rifkyrahid.my.id;

    # Izinkan upload CV (hingga 10MB) dan gambar (hingga 5MB)
    client_max_body_size 12M;

    # Sajikan file hasil upload langsung lewat Nginx agar cepat
    location /uploads/ {
        alias /var/www/portofolio/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Teruskan seluruh rute lain ke Next.js di port 3002
    # (3000 dipakai meccamadina, 3001 dipakai toyota-batam)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

